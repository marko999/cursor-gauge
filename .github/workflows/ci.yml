name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    name: Build & test (macOS)
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Test
        run: make test

      - name: Release build + app bundle
        run: make app

      - name: Smoke check
        run: make smoke-check

      - name: Verify arm64 Mach-O
        run: |
          file dist/CursorGauge.app/Contents/MacOS/CursorGauge | tee /tmp/file-out.txt
          grep -q 'arm64' /tmp/file-out.txt
